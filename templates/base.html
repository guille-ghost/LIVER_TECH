<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVER TECH | Ingeniería al Detalle</title> <!-- Nombre oficial -->
    
    <!-- Bootstrap Local -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <!-- Tu propio CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}?v=1.6">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de Navegación Institucional -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm border-bottom">
        <div class="container">
            <!-- Logo oficial basado en el PDF -->
            <a class="navbar-brand fw-bold text-primary" href="{{ url_for('inicio') }}">
                🔷 LIVER TECH <span class="fs-6 text-secondary fw-normal d-none d-md-inline">| Ingeniería al Detalle</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-dark fw-medium" href="{{ url_for('inicio') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-dark fw-medium" href="{{ url_for('nosotros') }}">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link text-dark fw-medium" href="{{ url_for('servicios') }}">Servicios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal Dinámico -->
    <main class="container my-5 flex-grow-1">
        {% block contenido %}{% endblock %}
    </main>

    <!-- Pie de Página Formal -->
    <footer class="bg-dark text-light py-4 mt-auto border-top border-secondary border-opacity-10">
        <div class="container text-center">
            <p class="mb-1 text-white-50">© 2026 LIVER TECH S.A.C. Todos los derechos reservados.</p>
            <p class="mb-0 text-muted small">Documentación Técnica de Operaciones | Perú</p>
        </div>
    </footer>

    <div class="contenedor-flotante">

        <a href="https://facebook.com" target="_blank" class="btn-flotante btn-facebook" aria-label="Facebook">
            <svg xmlns="http://w3.org" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
